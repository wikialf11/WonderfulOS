# Motor Linux de WonderfulOS en el Mac: un Debian pequeño con la virtualización de Apple
# (vz) y Rosetta, para instalar y usar apps de Linux (Flathub, AppImage, .deb) en
# ventanas de WonderfulOS (Xpra). Lo usa desktop/linux.mjs; __COMPARTIDO__ se sustituye.
minimumLimaVersion: 2.0.0
base:
- template:_images/debian-13
vmType: vz
cpus: 4
memory: 4GiB
disk: 40GiB
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
mounts:
- location: "__COMPARTIDO__"
  mountPoint: /mnt/nubeos
  writable: true
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux
    # Solo la primera vez: en los demás arranques no se reinstala nada (si no, cada arranque tardaba minutos).
    [ -f /var/lib/nubeos-listo ] && exit 0
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends ca-certificates curl wget gnupg flatpak libfuse2t64 dbus-x11 \
      xdg-desktop-portal xdg-desktop-portal-gtk fonts-noto fonts-noto-color-emoji fonts-inter locales xauth
    sed -i 's/^# *es_ES.UTF-8/es_ES.UTF-8/' /etc/locale.gen && locale-gen
    # Xpra con su cliente web (ventanas de Linux dentro de WonderfulOS)
    wget -qO /usr/share/keyrings/xpra.asc https://xpra.org/xpra.asc
    . /etc/os-release
    wget -qO /etc/apt/sources.list.d/xpra.sources "https://raw.githubusercontent.com/Xpra-org/xpra/master/packaging/repos/${VERSION_CODENAME}/xpra.sources"
    apt-get update
    apt-get install -y xpra xpra-html5 xpra-x11 || apt-get install -y xpra
    flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    # Programas de Intel (x86_64, la mayoría de AppImage y .deb): Rosetta los ejecuta y
    # estas bibliotecas son las que suelen necesitar (GTK, Qt/X11, Electron, sonido…).
    dpkg --add-architecture amd64
    apt-get update
    apt-get install -y --no-install-recommends libc6:amd64 libstdc++6:amd64 zlib1g:amd64 libuuid1:amd64 libbsd0:amd64 \
      libx11-6:amd64 libx11-xcb1:amd64 libxcb1:amd64 libxkbcommon0:amd64 libxkbcommon-x11-0:amd64 libxext6:amd64 libxrender1:amd64 \
      libxi6:amd64 libxcursor1:amd64 libxrandr2:amd64 libxss1:amd64 libxtst6:amd64 libxcomposite1:amd64 libxdamage1:amd64 libxfixes3:amd64 \
      libsm6:amd64 libice6:amd64 libfontconfig1:amd64 libfreetype6:amd64 libgl1:amd64 libegl1:amd64 libgbm1:amd64 libdrm2:amd64 \
      libgtk-3-0t64:amd64 libnss3:amd64 libasound2t64:amd64 libsecret-1-0:amd64 libcups2t64:amd64 libfuse2t64:amd64 \
      libxcb-cursor0:amd64 libxcb-icccm4:amd64 libxcb-image0:amd64 libxcb-keysyms1:amd64 libxcb-render-util0:amd64 libxcb-xinerama0:amd64 \
      libxcb-randr0:amd64 libxcb-shape0:amd64 libxcb-xfixes0:amd64 libxcb-xkb1:amd64 libdbus-1-3:amd64 libglib2.0-0t64:amd64 || true
    touch /var/lib/nubeos-listo
- mode: user
  script: |
    #!/bin/bash
    flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
probes:
- script: |
    #!/bin/bash
    timeout 1800 bash -c 'until test -f /var/lib/nubeos-listo; do sleep 5; done'
  hint: Preparando el motor Linux de WonderfulOS
