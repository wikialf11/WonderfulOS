<!doctype html>
<html lang="es" data-reduce-motion>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>WonderfulOS</title>
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <div id="screen"></div>
  <div id="home"></div>
  <nav id="menubar"></nav>
  <div id="windows"></div>
  <div id="snap-preview"></div>
  <nav id="dock"></nav>
  <div id="launchpad" hidden></div>
  <div id="spotlight" class="glass-panel" hidden></div>
  <div id="control" class="glass-panel" hidden></div>
  <div id="toasts"></div>

  <script type="module" src="js/desktop.js"></script>

</html>
