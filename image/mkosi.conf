# Imagen instalable de NubeOS (esbozo). Se construye con mkosi:
#   https://github.com/systemd/mkosi
# Resultado: una imagen de disco UEFI arrancable (out/nubeos.raw) que se puede
# grabar en un USB o instalar en un PC.

[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64

[Output]
Format=disk
ImageId=nubeos
OutputDirectory=out

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=quiet splash
Hostname=nubeos
Autologin=no
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        systemd-resolved
        network-manager
        dbus
        polkitd
        cage
        chromium
        fonts-noto
        fonts-noto-color-emoji
        pipewire
        wireplumber
        plymouth
        sudo
# Usuario sin privilegios que ejecuta el escritorio en modo kiosko.
PostInstallationScripts=mkosi.postinst
